<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            padding: 30px;a
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        h2 {
            color: #444;
            margin-bottom: 15px;
        }

        .form-section {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 5px;
        }

        .add-btn {
            background-color: #007bff;
            color: white;
        }

        .search-btn {
            background-color: #28a745;
            color: white;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .clear-btn {
            background-color: #6c757d;
            color: white;
        }

        button:hover {
            opacity: 0.8;
        }

        .search-section {
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .message {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        /* Responsive Design */
        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .search-box {
                flex-direction: column;
            }

            table {
                font-size: 14px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>


        <!-- Student Form -->

        <div class="form-section">

            <h2>Add Student</h2>

            <form id="studentForm">

                <div class="form-group">

                    <label for="studentId">
                        Student ID
                    </label>

                    <input type="text"
                           id="studentId"
                           placeholder="Enter Student ID"
                           required>

                </div>


                <div class="form-group">

                    <label for="studentName">
                        Student Name
                    </label>

                    <input type="text"
                           id="studentName"
                           placeholder="Enter Student Name"
                           required>

                </div>


                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select id="course" required>

                        <option value="">
                            Select Course
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="EEE">
                            EEE
                        </option>

                        <option value="MECH">
                            MECH
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="marks">
                        Marks
                    </label>

                    <input type="number"
                           id="marks"
                           min="0"
                           max="100"
                           placeholder="Enter Marks"
                           required>

                </div>


                <button type="submit"
                        class="add-btn">
                    Add Student
                </button>

                <button type="reset"
                        class="clear-btn">
                    Clear
                </button>

            </form>

        </div>


        <!-- Search -->

        <div class="search-section">

            <h2>Search Student</h2>

            <div class="search-box">

                <input type="text"
                       id="searchInput"
                       placeholder="Enter Student ID">

                <button class="search-btn"
                        onclick="searchStudent()">
                    Search
                </button>

                <button class="clear-btn"
                        onclick="displayStudents()">
                    Show All
                </button>

            </div>

        </div>


        <div id="message"></div>


        <!-- Student Table -->

        <h2>Student Records</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>


    <!-- External JavaScript -->

    <script src="Untitled-1.js"></script>

</body>

</html>
