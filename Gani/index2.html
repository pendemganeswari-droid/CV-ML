<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Interactive Calculator</title>

    <style>

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Calculator */
        .calculator {
            width: 350px;
            padding: 25px;

            background-color: #222;
            border-radius: 15px;

            box-shadow: 0 5px 20px
                        rgba(0, 0, 0, 0.3);
        }

        /* Heading */
        h2 {
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }

        /* Display */
        #display {
            width: 100%;
            height: 60px;

            margin-bottom: 15px;
            padding: 10px;

            font-size: 28px;
            text-align: right;

            border: none;
            border-radius: 8px;
        }

        /* Buttons */
        .buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 55px;

            border: none;
            border-radius: 8px;

            font-size: 20px;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        /* Operators */
        .operator {
            background-color: #ff9500;
            color: white;
        }

        /* Equal button */
        .equal {
            background-color: #28a745;
            color: white;
        }

        /* Zero button */
        .zero {
            grid-column: span 2;
        }

        /* Responsive Design */
        @media (max-width: 400px) {

            .calculator {
                width: 95%;
            }

            button {
                height: 50px;
                font-size: 18px;
            }
        }

    </style>
</head>

<body>

    <div class="calculator">

        <h2>Interactive Calculator</h2>

        <!-- Calculator Display -->
        <input type="text"
               id="display"
               readonly>

        <!-- Calculator Buttons -->
        <div class="buttons">

            <button onclick="clearDisplay()">C</button>

            <button onclick="deleteLast()">⌫</button>

            <button onclick="appendValue('%')">%</button>

            <button class="operator"
                    onclick="appendValue('/')">
                ÷
            </button>


            <button onclick="appendValue('7')">
                7
            </button>

            <button onclick="appendValue('8')">
                8
            </button>

            <button onclick="appendValue('9')">
                9
            </button>

            <button class="operator"
                    onclick="appendValue('*')">
                ×
            </button>


            <button onclick="appendValue('4')">
                4
            </button>

            <button onclick="appendValue('5')">
                5
            </button>

            <button onclick="appendValue('6')">
                6
            </button>

            <button class="operator"
                    onclick="appendValue('-')">
                −
            </button>


            <button onclick="appendValue('1')">
                1
            </button>

            <button onclick="appendValue('2')">
                2
            </button>

            <button onclick="appendValue('3')">
                3
            </button>

            <button class="operator"
                    onclick="appendValue('+')">
                +
            </button>


            <button class="zero"
                    onclick="appendValue('0')">
                0
            </button>

            <button onclick="appendValue('.')">
                .
            </button>

            <button class="equal"
                    onclick="calculate()">
                =
            </button>

        </div>

    </div>


    <!-- Link JavaScript File -->
    <script src="script2.js"></script>

</body>
</html>
